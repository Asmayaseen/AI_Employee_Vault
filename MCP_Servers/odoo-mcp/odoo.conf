[options]
; AI Employee — Odoo Community Production Config
; Used by docker-compose.cloud.yml

; Database
db_host = odoo-db-cloud
db_port = 5432
db_name = odoo
db_user = odoo

; Security
admin_passwd = ${ODOO_MASTER_PASSWORD}
list_db = False

; Performance
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120

; Proxy mode (nginx handles SSL)
proxy_mode = True

; Logging
log_level = warn
log_handler = :WARNING

; Paths
data_dir = /var/lib/odoo
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
