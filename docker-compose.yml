version: '3.8'

services:
  # Flask Dashboard API
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_employee_dashboard
    ports:
      - "9000:9000"
    environment:
      VAULT_PATH: /app/AI_Employee_Vault
      LOG_PATH: /app/AI_Employee_Vault/Logs
      DASHBOARD_PORT: 9000
    volumes:
      - vault_data:/app/AI_Employee_Vault
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Web UI
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    container_name: ai_employee_webui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://dashboard:9000
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

  # Odoo ERP
  odoo-db:
    image: postgres:16
    container_name: odoo_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_password}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: odoo_server
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_password}
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  vault_data:
  odoo_db_data:
  odoo_data:
  odoo_addons:
