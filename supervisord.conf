[supervisord]
nodaemon=true
logfile=/app/AI_Employee_Vault/Logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/tmp/supervisord.pid

; ── Flask Dashboard (primary web process) ──────────────────────
[program:dashboard]
command=python /app/app.py
directory=/app
autostart=true
autorestart=true
startretries=5
stderr_logfile=/app/AI_Employee_Vault/Logs/dashboard.err.log
stdout_logfile=/app/AI_Employee_Vault/Logs/dashboard.out.log
environment=
    VAULT_PATH="/app/AI_Employee_Vault",
    AGENT_MODE="draft_only",
    AGENT_NAME="cloud",
    DRY_RUN="false",
    PORT="7860",
    PYTHONUNBUFFERED="1"
priority=1

; ── Cloud Agent Orchestrator (background worker) ───────────────
[program:orchestrator]
command=python /app/AI_Employee_Vault/Watchers/orchestrator.py
directory=/app/AI_Employee_Vault/Watchers
autostart=true
autorestart=true
startretries=3
startsecs=10
stderr_logfile=/app/AI_Employee_Vault/Logs/orchestrator.err.log
stdout_logfile=/app/AI_Employee_Vault/Logs/orchestrator.out.log
environment=
    VAULT_PATH="/app/AI_Employee_Vault",
    AGENT_MODE="draft_only",
    AGENT_NAME="cloud",
    DRY_RUN="false",
    PYTHONUNBUFFERED="1"
priority=2

; ── Approval Watcher (monitors Approved/ folder) ───────────────
[program:approval-watcher]
command=python /app/AI_Employee_Vault/Watchers/approval_watcher.py
directory=/app/AI_Employee_Vault/Watchers
autostart=true
autorestart=true
startretries=3
startsecs=15
stderr_logfile=/app/AI_Employee_Vault/Logs/approval_watcher.err.log
stdout_logfile=/app/AI_Employee_Vault/Logs/approval_watcher.out.log
environment=
    VAULT_PATH="/app/AI_Employee_Vault",
    AGENT_MODE="draft_only",
    AGENT_NAME="cloud",
    DRY_RUN="false",
    PYTHONUNBUFFERED="1"
priority=3

; ── Health Monitor ──────────────────────────────────────────────
[program:health-monitor]
command=python /app/AI_Employee_Vault/Watchers/health_monitor.py
directory=/app/AI_Employee_Vault/Watchers
autostart=true
autorestart=true
startretries=3
startsecs=20
stderr_logfile=/app/AI_Employee_Vault/Logs/health_monitor.err.log
stdout_logfile=/app/AI_Employee_Vault/Logs/health_monitor.out.log
environment=
    VAULT_PATH="/app/AI_Employee_Vault",
    AGENT_NAME="cloud",
    HEALTH_CHECK_INTERVAL="60",
    PYTHONUNBUFFERED="1"
priority=4

[group:ai-employee]
programs=dashboard,orchestrator,approval-watcher,health-monitor
