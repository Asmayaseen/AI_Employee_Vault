environment=
    VAULT_PATH="/app/AI_Employee_Vault",
    AGENT_MODE="draft_only",
    DRY_RUN="false",
    PYTHONUNBUFFERED="1"
priority=8

[group:ai-employee]
programs=dashboard,orchestrator,approval-watcher,health-monitor,gmail-watcher,facebook-watcher,twitter-watcher,filesystem-watcher
